spring.application.name=user-service

server.port=8081

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=productDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=spring_user
spring.datasource.password=password
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/food-delivery

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Keycloak Admin API Configuration
app.keycloak.server-url=http://localhost:8080
app.keycloak.realm=food-delivery
app.keycloak.admin-client-id=user-service-admin
app.keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}

# Keycloak Custom React Login Configuration
app.keycloak.login-client-id=food-delivery-react-login
app.keycloak.login-client-secret=${FOOD_DELIVERY_LOGIN_CLIENT_SECRET}

# Refresh token cookie (false for local HTTP development)
app.keycloak.refresh-cookie-secure=false