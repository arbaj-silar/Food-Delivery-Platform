
spring.application.name=payment-service

server.port=8088

# SQL Server Database
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=productDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=spring_user
spring.datasource.password=password
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Keycloak JWT
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/food-delivery

# Internal service-to-service authentication
app.internal-service-key=${FOOD_DELIVERY_INTERNAL_SERVICE_KEY:change-this-local-only-secret}

# Order Service integration
app.order-service.url=http://order-service
