spring.application.name=delivery-service

# Server Configuration
server.port=8086

# SQL Server Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=productDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=spring_user
spring.datasource.password=password
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Eureka Client Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Keycloak JWT Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/food-delivery

# Logging
logging.level.com.fooddelivery.delivery=INFO

# Internal Service Security
app.internal-service-key=${FOOD_DELIVERY_INTERNAL_SERVICE_KEY:change-this-local-only-secret}
# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Notification Exchange
app.rabbitmq.notification-exchange=fooddelivery.notification.exchange

# Notification Routing Key
app.rabbitmq.notification-routing-key=notification.delivery